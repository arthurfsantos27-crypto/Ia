<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Catálogo Electrolux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Section -->
    <div id="auth-section" class="container">
        <div class="card">
            <h2 style="color: #0033a0;">Catálogo Electrolux</h2>
            <p>Preços Baixos Garantidos</p>
            <h3>Acesso Administrativo</h3>
            <div class="form-group">
                <input type="text" id="username" placeholder="Usuário">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Senha">
            </div>
            <button onclick="login()">Entrar</button>
            <button onclick="register()" style="background-color: #333;">Registrar Admin</button>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="container" style="display: none;">
        <header>
            <h1 style="color: #0033a0;">Electrolux - Catálogo Administrativo</h1>
            <button onclick="logout()" style="background-color: #dc3545; width: auto; padding: 10px 20px;">Sair</button>
        </header>

        <div class="actions">
            <input type="text" id="searchInput" placeholder="Buscar eletrodoméstico por nome..." onkeyup="searchProducts()">
            <button onclick="showModal('add')" style="width: 200px;">+ Novo Produto</button>
        </div>

        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome do Produto</th>
                    <th>Descrição</th>
                    <th>Preço (R$)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="productsBody">
                <!-- Products dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Adicionar Produto</h3>
            <input type="hidden" id="productId">
            <div class="form-group">
                <label>Nome do Produto (Electrolux):</label>
                <input type="text" id="prodName" required>
            </div>
            <div class="form-group">
                <label>Descrição:</label>
                <input type="text" id="prodDesc" required>
            </div>
            <div class="form-group">
                <label>Preço Promocional (R$):</label>
                <input type="number" id="prodPrice" step="0.01" min="0" required>
                <small style="color: #dc3545; display: block; margin-top: 5px;">Regra de Segurança: Preços negativos não permitidos no backend/frontend.</small>
            </div>
            <div class="form-group">
                <button onclick="saveProduct()">Salvar Produto</button>
                <button onclick="closeModal()" style="background-color: #6c757d; margin-top: 10px;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
